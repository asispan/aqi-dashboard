<!doctype html>
<html><head><meta charset="utf-8"><title>render</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
/* Product renders of the dashboard on real tablet geometry (mm units).
   ?scene=hero|lineup|ipad|mipad|pair   ?w=2400&h=1350
   Screens are real dashboard screenshots from docs/screens/. */
import * as THREE from "three";
import {RoundedBoxGeometry} from "three/addons/geometries/RoundedBoxGeometry.js";
import {RoomEnvironment} from "three/addons/environments/RoomEnvironment.js";

const Q=new URLSearchParams(location.search), SCENE=Q.get("scene")||"hero";
const W=+Q.get("w")||2400, H=+Q.get("h")||1350;
const SHOTS="../../docs/screens/";

const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
const loader=new THREE.TextureLoader();
const maxAniso=renderer.capabilities.getMaxAnisotropy();

function gradientBg(stops,radial=true){
  const c=document.createElement("canvas");c.width=1024;c.height=576;const g=c.getContext("2d");
  const gr=radial?g.createRadialGradient(512,250,40,512,300,760):g.createLinearGradient(0,0,0,576);
  stops.forEach(([o,col])=>gr.addColorStop(o,col));g.fillStyle=gr;g.fillRect(0,0,1024,576);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}

function roundedRectShape(w,h,r){const s=new THREE.Shape(),x=-w/2,y=-h/2;
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);
  s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s}
function planeUV(geo,w,h){const p=geo.attributes.position,uv=[];
  for(let i=0;i<p.count;i++)uv.push(p.getX(i)/w+.5,p.getY(i)/h+.5);
  geo.setAttribute("uv",new THREE.Float32BufferAttribute(uv,2));return geo}

/* Device specs (landscape, mm) */
const DEV={
  mipad:{w:200.4,h:132.6,d:6.95,r:9,screenW:160.5,screenH:120.4,screenR:0.6,screenX:0,
         body:{color:0xd9c4a5,metalness:.9,roughness:.32},glassR:8},
  ipad:{w:248.6,h:179.5,d:7.0,r:15,screenW:227.4,screenH:158.0,screenR:9,screenX:0,
        body:{color:0x9aa7b8,metalness:.85,roughness:.35},glassR:14}
};

function tablet(kind,shot,{bodyColor}={}){
  const s=DEV[kind],g=new THREE.Group();
  const b=Math.min(s.d/2-0.4,2.6);
  const bodyGeo=new THREE.ExtrudeGeometry(roundedRectShape(s.w-2*b,s.h-2*b,s.r-b),
    {depth:s.d-2*b,bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:10,curveSegments:40});
  bodyGeo.translate(0,0,-(s.d-2*b)/2);
  const body=new THREE.Mesh(bodyGeo,new THREE.MeshPhysicalMaterial({...s.body,...(bodyColor?{color:bodyColor}:{}),clearcoat:.3,clearcoatRoughness:.4}));
  body.castShadow=true;body.receiveShadow=true;g.add(body);
  // corner rounding: mask the box corners with a rounded glass front + slightly smaller back
  const glass=new THREE.Mesh(new THREE.ShapeGeometry(roundedRectShape(s.w-0.6,s.h-0.6,s.glassR),24),
    new THREE.MeshPhysicalMaterial({color:0x050608,roughness:.08,metalness:0,clearcoat:1,clearcoatRoughness:.03,reflectivity:.6}));
  glass.position.z=s.d/2+0.02;g.add(glass);
  const tex=loader.load(SHOTS+shot+".png",t=>{t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=maxAniso;t.needsUpdate=true;});
  const scr=new THREE.Mesh(planeUV(new THREE.ShapeGeometry(roundedRectShape(s.screenW,s.screenH,s.screenR),16),s.screenW,s.screenH),
    new THREE.MeshBasicMaterial({map:tex,toneMapped:false}));
  scr.position.set(s.screenX,0,s.d/2+0.3);g.add(scr);
  // front camera
  const cam=new THREE.Mesh(new THREE.CircleGeometry(kind==="mipad"?1.4:1.2,24),new THREE.MeshPhysicalMaterial({color:0x111522,roughness:.2,clearcoat:1}));
  if(kind==="mipad")cam.position.set(-s.w/2+9.5,0,s.d/2+0.3);else cam.position.set(0,s.h/2-5,s.d/2+0.3);
  g.add(cam);
  // screen light spill (makes night presets glow onto the surface)
  g.userData={kind,spec:s,screen:scr};
  return g;
}

function stand(width,color=0x1a1c22){
  const g=new THREE.Group();
  const m=new THREE.MeshPhysicalMaterial({color,metalness:.6,roughness:.35,clearcoat:.5});
  const base=new THREE.Mesh(new RoundedBoxGeometry(width,6,46,4,2.5),m);base.position.set(0,3,6);base.castShadow=base.receiveShadow=true;g.add(base);
  const lip=new THREE.Mesh(new RoundedBoxGeometry(width,9,5,4,2),m);lip.position.set(0,7,25);lip.castShadow=true;g.add(lip);
  return g;
}
// put a tablet on a stand: leaning back by tilt (rad), bottom edge resting on the stand lip
function onStand(t,tilt=0.26){const s=t.userData.spec;const g=new THREE.Group();
  t.rotation.x=-tilt;t.position.set(0,6+ s.h/2*Math.cos(tilt),18 - s.h/2*Math.sin(tilt));g.add(t);
  g.add(stand(s.w*0.62));return g}

function floor(color=0x0b0c10,rough=.35,opacity=1){ // seamless studio sweep: floor curving up into a back wall
  const segX=2,segV=160,R=520,Lf=2600,Lw=2600,zBack=-380;const geo=new THREE.PlaneGeometry(6000,1,segX,segV);
  const pos=geo.attributes.position,total=Lf+Math.PI*R/2+Lw;
  for(let i=0;i<pos.count;i++){const v=(pos.getY(i)+.5)*total;let y,z;
    if(v<Lf){y=0;z=zBack+Lf-v}else if(v<Lf+Math.PI*R/2){const a=(v-Lf)/R;y=R-R*Math.cos(a);z=zBack-R*Math.sin(a)}
    else{y=R+(v-Lf-Math.PI*R/2);z=zBack-R}
    pos.setXYZ(i,pos.getX(i),y,z)}
  geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color,roughness:Math.max(rough,.6),metalness:0,envMapIntensity:.25,side:THREE.DoubleSide,transparent:opacity<1,opacity}));
  m.receiveShadow=true;return m}

function keyLight(x,y,z,i=2.2,col=0xffffff){const l=new THREE.SpotLight(col,i,0,0.55,0.8,0);l.position.set(x,y,z);
  l.castShadow=true;l.shadow.mapSize.set(2048,2048);l.shadow.bias=-0.0002;l.shadow.radius=6;l.target.position.set(0,60,0);scene.add(l,l.target);return l}
function rim(x,y,z,col,i){ // coloured wash on the back wall + a soft edge light on the devices
  const l=new THREE.SpotLight(col,i*3.2,0,0.42,1,0);l.position.set(x*0.5,650,420);l.target.position.set(x*1.5,420,-900);scene.add(l,l.target);
  const e=new THREE.PointLight(col,i*0.12,0,0);e.position.set(x,y,z);scene.add(e);return l}
function bokeh(n,cols,spread=1400,yMin=150,yMax=700,z=-900){
  const c=document.createElement("canvas");c.width=c.height=128;const g=c.getContext("2d");
  const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,"rgba(255,255,255,1)");gr.addColorStop(.55,"rgba(255,255,255,.55)");gr.addColorStop(1,"rgba(255,255,255,0)");
  g.fillStyle=gr;g.fillRect(0,0,128,128);const tex=new THREE.CanvasTexture(c);
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let i=0;i<n;i++){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,color:cols[i%cols.length],transparent:true,opacity:.18+rnd()*.3,depthWrite:false,blending:THREE.AdditiveBlending}));
    const s=40+rnd()*120;sp.scale.set(s,s,1);sp.position.set((rnd()-.5)*spread,yMin+rnd()*(yMax-yMin),z-rnd()*300);scene.add(sp)}}


// glossy-floor look: a mirrored copy under a semi-transparent floor
function withReflection(obj){const m=obj.clone(true);m.scale.y*=-1;m.position.y=-obj.position.y;
  m.traverse(o=>{if(o.isMesh){o.material=o.material.clone();o.material.side=THREE.DoubleSide;o.castShadow=false}});
  scene.add(obj,m);return obj}
function kicker(){const l=new THREE.DirectionalLight(0xffffff,1.1);l.position.set(0,500,-600);scene.add(l)}
const cam=new THREE.PerspectiveCamera(30,W/H,80,8000);

function done(){let frames=0;const tick=()=>{renderer.render(scene,cam);if(++frames<40)requestAnimationFrame(tick);else{document.title="done";window.__done=true}};tick()}

/* ---------------- scenes ---------------- */
if(SCENE==="hero"){
  scene.background=gradientBg([[0,"#20262f"],[.55,"#0e1116"],[1,"#050608"]]);
  scene.add(floor(0x0c0e12,.28,.88));kicker();
  const a=onStand(tablet("ipad","ipad-bone-day"));a.position.set(105,0,-60);a.rotation.y=-0.32;withReflection(a);
  const b=onStand(tablet("mipad","mipad-sunny-meadow-night"));b.position.set(-120,0,20);b.rotation.y=0.36;withReflection(b);
  keyLight(-300,700,500,2.4);rim(420,420,-260,0xffc28a,3.2);rim(-440,400,-240,0x7fe3a6,2.8);
  bokeh(26,[0xffcf8f,0x9fe6b8,0xffffff]);
  cam.position.set(-10,150,560);cam.lookAt(-5,58,-10);
}
if(SCENE==="lineup"){
  scene.background=gradientBg([[0,"#262230"],[.6,"#100e15"],[1,"#060508"]]);
  scene.add(floor(0x0d0c11,.3,.88));kicker();
  const shots=["mipad-default-day","mipad-bone-day","mipad-sunny-meadow-night","mipad-plum-sage-day","mipad-plum-sage-night"];
  shots.forEach((sh,i)=>{const k=i-2;const t=onStand(tablet("mipad",sh,{bodyColor:[0xd9c4a5,0xc9ccd2,0x6d717a,0xd9c4a5,0xc9ccd2][i]}),0.24);
    t.position.set(k*212,0,-k*k*38);t.rotation.y=-k*0.17;withReflection(t)});
  keyLight(0,800,600,2.6);rim(-700,500,-250,0xb9a6ff,3.2);rim(700,500,-250,0xffb38a,3.2);
  bokeh(30,[0xffe0b0,0xc8b8ff,0xffffff],2000);
  cam.position.set(0,190,1080);cam.lookAt(0,52,-70);cam.fov=26;cam.updateProjectionMatrix();
}
if(SCENE==="ipad"){
  scene.background=gradientBg([[0,"#efe9e1"],[.7,"#d9d0c4"],[1,"#c2b6a6"]]);
  scene.add(floor(0xd8cfc3,.45));
  const a=onStand(tablet("ipad","ipad-plum-sage-day",{bodyColor:0xc7ccd4}),0.22);a.rotation.y=-0.42;scene.add(a);
  keyLight(-420,640,420,2.0,0xfff4e6);rim(420,320,260,0xffffff,2.7);
  // a few decor objects: a stone and a plant pot silhouette for scale
  const stone=new THREE.Mesh(new THREE.SphereGeometry(26,48,32),new THREE.MeshPhysicalMaterial({color:0x8e8577,roughness:.8}));
  stone.scale.set(1.5,.55,1.1);stone.position.set(185,13,40);stone.castShadow=stone.receiveShadow=true;scene.add(stone);
  const prof=[[0,0],[26,0],[34,14],[38,40],[34,72],[22,96],[17,112],[19,120],[0,120]].map(([x,y])=>new THREE.Vector2(x,y));
  const vase=new THREE.Mesh(new THREE.LatheGeometry(prof,64),new THREE.MeshPhysicalMaterial({color:0xb7684a,roughness:.55,clearcoat:.4}));
  vase.position.set(-215,0,-60);vase.castShadow=vase.receiveShadow=true;scene.add(vase);
  cam.position.set(-40,170,520);cam.lookAt(0,80,0);
}
if(SCENE==="mipad"){
  scene.background=gradientBg([[0,"#14231b"],[.55,"#0a110d"],[1,"#030504"]]);
  scene.add(floor(0x09100c,.25,.88));kicker();
  const a=onStand(tablet("mipad","mipad-sunny-meadow-night",{bodyColor:0x6d717a}),0.24);a.rotation.y=0.30;withReflection(a);
  keyLight(300,620,380,1.4);rim(-380,420,-200,0x7fe3a6,3.5);rim(380,380,-260,0xd0db97,2.2);
  const glow=new THREE.PointLight(0x9fd88a,0.5,0,0);glow.position.set(0,90,160);scene.add(glow);
  bokeh(22,[0x9fe6b8,0xd0db97],1500);
  cam.position.set(40,120,410);cam.lookAt(0,58,0);
}
if(SCENE==="pair"){
  scene.background=gradientBg([[0,"#2a2018"],[.6,"#120d0a"],[1,"#050403"]]);
  scene.add(floor(0x110d0b,.3,.88));kicker();
  const a=onStand(tablet("ipad","ipad-plum-sage-night",{bodyColor:0xc7ccd4}));a.position.set(-110,0,-40);a.rotation.y=0.30;withReflection(a);
  const b=onStand(tablet("mipad","mipad-bone-night"));b.position.set(130,0,30);b.rotation.y=-0.34;withReflection(b);
  keyLight(250,700,500,2.2);rim(-460,420,-260,0xffb38a,3.2);rim(460,420,-260,0x1fff93,1.8);
  bokeh(26,[0xffcf8f,0xffffff,0x9fffd0]);
  cam.position.set(0,150,580);cam.lookAt(5,58,-5);
}
THREE.DefaultLoadingManager.onLoad=()=>done();
</script></body></html>
